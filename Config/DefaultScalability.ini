; APS full-scale stellar rendering quality overrides.
; Thousands of distant emissive stars project to only a few pixels. The stock
; Epic profile stores TSR history in packed R11G11B10 and can evaluate
; convolution bloom at half resolution. Preserve the normal TSR renderer, but
; give stellar highlights a full-precision, longer history and full-resolution
; convolution bloom where that method is selected by a volume/camera.

[AntiAliasingQuality@3]
r.TSR.History.R11G11B10=0
r.TSR.History.ScreenPercentage=200
r.TSR.History.UpdateQuality=3
r.TSR.ShadingRejection.Flickering=1
r.TSR.RejectionAntiAliasingQuality=2
r.TSR.Resurrection=1

[AntiAliasingQuality@Cine]
r.TSR.History.R11G11B10=0
r.TSR.History.ScreenPercentage=200
r.TSR.History.UpdateQuality=3
r.TSR.ShadingRejection.Flickering=1
r.TSR.RejectionAntiAliasingQuality=2
r.TSR.Resurrection=1

[PostProcessQuality@3]
r.Bloom.ScreenPercentage=100

[PostProcessQuality@Cine]
r.Bloom.ScreenPercentage=100

; The engine's stock High profile replaces the hardware-derived streaming pool
; with a 1 GB cap. APS loads the generated world, station and character together,
; which legitimately needs about 3.8 GB in the current gameplay smoke scene.
; Keep a bounded pool with headroom and still clamp it to the machine's VRAM.
[TextureQuality@3]
r.Streaming.PoolSize=5120
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@Cine]
r.Streaming.PoolSize=6144
r.Streaming.LimitPoolSizeToVRAM=1
